<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<a href="#" style="display:flex;flex-direction:column;height:100%;background:#FFFFFF;border-radius:14px;overflow:hidden;text-decoration:none;color:#4A4A48;box-shadow:0 1px 2px rgba(20,51,42,.06),0 10px 28px rgba(20,51,42,.07);transition:box-shadow .2s ease,transform .2s ease" style-hover="box-shadow:0 2px 4px rgba(20,51,42,.08),0 16px 36px rgba(20,51,42,.11);transform:translateY(-2px)">
  <div style="aspect-ratio:4 / 5;overflow:hidden;background:#EFE9DD"><img src="{{ item.img }}" alt="{{ item.caption }}" style="width:100%;height:100%;object-fit:cover;object-position:center 20%;display:block;transition:transform .4s ease"></div>
  <div style="padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1">
    <span style="font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#5E5B55">{{ item.category }} · {{ item.occasion }}</span>
    <h3 style="margin:0;font-family:'Cormorant Garamond',serif;font-size:21px;line-height:1.2;font-weight:600;color:#2B2B2B;text-wrap:pretty">{{ item.title }}</h3>
    <sc-if value="{{ hasEstimate }}" hint-placeholder-val="{{ true }}">
      <span style="display:flex;align-items:center;gap:8px;margin-top:auto;padding-top:6px"><span style="font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#5E4A16;background:#F3EAD3;padding:3px 7px;border-radius:6px">Estimate</span><span style="font-size:14px;font-weight:600;color:#2B2B2B">{{ item.estimate }}</span></span>
    </sc-if>
  </div>
</a>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:260,&quot;height&quot;:460},&quot;item&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const i = this.props.item || {};
    return { hasEstimate: !!i.estimate };
  }
}
</script>
</body>
</html>
