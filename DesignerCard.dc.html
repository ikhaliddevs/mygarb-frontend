<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<a href="#" aria-label="View {{ designer.businessName }} profile" style="display:flex;flex-direction:column;height:100%;background:#FFFFFF;border-radius:16px;overflow:hidden;text-decoration:none;color:#4A4A48;box-shadow:0 1px 2px rgba(20,51,42,.06),0 10px 28px rgba(20,51,42,.07);transition:box-shadow .2s ease,transform .2s ease" style-hover="box-shadow:0 2px 4px rgba(20,51,42,.08),0 16px 36px rgba(20,51,42,.11);transform:translateY(-2px)">
  <sc-if value="{{ mosaic }}" hint-placeholder-val="{{ true }}">
    <div style="display:grid;grid-template-columns:2fr 1fr;grid-template-rows:100px 100px;gap:3px">
      <div style="grid-row:1 / span 2;overflow:hidden"><img src="{{ i0 }}" alt="{{ i0Alt }}" style="width:100%;height:100%;object-fit:cover;object-position:center 20%;display:block;background:#EFE9DD"></div>
      <div style="overflow:hidden"><img src="{{ i1 }}" alt="{{ i1Alt }}" style="width:100%;height:100%;object-fit:cover;object-position:center 20%;display:block;background:#EFE9DD"></div>
      <div style="overflow:hidden"><img src="{{ i2 }}" alt="{{ i2Alt }}" style="width:100%;height:100%;object-fit:cover;object-position:center 20%;display:block;background:#EFE9DD"></div>
    </div>
  </sc-if>
  <sc-if value="{{ strip }}">
    <div style="height:200px;overflow:hidden"><img src="{{ i0 }}" alt="{{ i0Alt }}" style="width:100%;height:100%;object-fit:cover;object-position:center 20%;display:block;background:#EFE9DD"></div>
  </sc-if>
  <div style="padding:18px 20px 18px;display:flex;flex-direction:column;gap:12px;flex:1">
    <div style="display:flex;gap:12px;align-items:center">
      <span style="flex:none;width:48px;height:48px;border-radius:50%;background:{{ designer.avatarTone }};border:2px solid #FFFFFF;box-shadow:0 0 0 1px #E6DFD0;display:flex;align-items:center;justify-content:center;font-family:'Cormorant Garamond',serif;font-size:18px;font-weight:600;color:#2B2B2B">{{ designer.initials }}</span>
      <div style="display:flex;flex-direction:column;gap:2px;min-width:0">
        <h3 style="margin:0;font-family:'Cormorant Garamond',serif;font-size:23px;line-height:1.15;font-weight:600;color:#2B2B2B">{{ designer.businessName }}</h3>
        <span style="display:flex;align-items:center;gap:4px;font-size:13px;color:#5E5B55"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 21s-7-6.2-7-11.5a7 7 0 1 1 14 0C19 14.8 12 21 12 21Z"></path><circle cx="12" cy="9.5" r="2.5"></circle></svg>{{ designer.serviceLocation }}</span>
      </div>
    </div>
    <sc-if value="{{ hasReviews }}" hint-placeholder-val="{{ true }}">
      <span style="display:flex;align-items:center;gap:6px;font-size:14px;color:#4A4A48"><svg width="16" height="16" viewBox="0 0 24 24" fill="#B8913F" aria-hidden="true"><path d="m12 3 2.7 5.6 6.1.8-4.5 4.3 1.1 6.1L12 16.9l-5.4 2.9 1.1-6.1L3.2 9.4l6.1-.8L12 3Z"></path></svg><strong style="color:#2B2B2B;font-weight:600">{{ designer.rating }}</strong><span style="color:#5E5B55">· {{ reviewLabel }}</span></span>
    </sc-if>
    <sc-if value="{{ noReviews }}">
      <span style="display:flex;align-items:center;gap:6px;font-size:14px;color:#5E5B55"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8F8778" stroke-width="1.6" aria-hidden="true"><path d="m12 3 2.7 5.6 6.1.8-4.5 4.3 1.1 6.1L12 16.9l-5.4 2.9 1.1-6.1L3.2 9.4l6.1-.8L12 3Z"></path></svg>No reviews yet</span>
    </sc-if>
    <div style="display:flex;flex-wrap:wrap;gap:6px">
      <sc-for list="{{ specs }}" as="s" hint-placeholder-count="3"><span style="font-size:13px;color:#4A4A48;background:#F3EDE1;padding:4px 10px;border-radius:999px">{{ s }}</span></sc-for>
    </div>
    <sc-if value="{{ strip }}">
      <div style="display:flex;flex-direction:column;gap:6px"><span style="font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#5E5B55">Sample work</span>
        <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px"><span style="height:72px;border-radius:8px;overflow:hidden"><img src="{{ i1 }}" alt="{{ i1Alt }}" style="width:100%;height:100%;object-fit:cover;object-position:center 20%;display:block;background:#EFE9DD"></span><span style="height:72px;border-radius:8px;overflow:hidden"><img src="{{ i2 }}" alt="{{ i2Alt }}" style="width:100%;height:100%;object-fit:cover;object-position:center 20%;display:block;background:#EFE9DD"></span><span style="height:72px;border-radius:8px;overflow:hidden"><img src="{{ i3 }}" alt="{{ i3Alt }}" style="width:100%;height:100%;object-fit:cover;object-position:center 20%;display:block;background:#EFE9DD"></span></div>
      </div>
    </sc-if>
    <div style="margin-top:auto;padding-top:14px;border-top:1px solid #EFE9DD;display:flex;justify-content:space-between;align-items:center;gap:8px">
      <sc-if value="{{ isOpen }}" hint-placeholder-val="{{ true }}"><span style="display:flex;align-items:center;gap:6px;font-size:13px;color:#2E5A45"><span style="width:7px;height:7px;border-radius:50%;background:#2E7A55"></span>{{ designer.availability }}</span></sc-if>
      <sc-if value="{{ isLimited }}"><span style="display:flex;align-items:center;gap:6px;font-size:13px;color:#74490A"><span style="width:7px;height:7px;border-radius:50%;background:#C08A2E"></span>{{ designer.availability }}</span></sc-if>
      <span style="display:flex;align-items:center;gap:4px;font-size:14px;font-weight:600;color:#1F4D3A">View profile<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></span>
    </div>
  </div>
</a>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:360,&quot;height&quot;:440},&quot;designer&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object&quot;},&quot;layout&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;mosaic&quot;,&quot;strip&quot;],&quot;default&quot;:&quot;mosaic&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const d = this.props.designer || {};
    const im = d.images || [];
    const alts = d.alts || [];
    const c = d.captions || ['Sample work'];
    const n = d.reviewCount || 0;
    const layout = this.props.layout ?? 'mosaic';
    return {
      i0: im[0], i1: im[1], i2: im[2], i3: im[3] || im[0], i0Alt: alts[0] || 'Work by ' + d.businessName, i1Alt: alts[1] || 'Sample work', i2Alt: alts[2] || 'Sample work', i3Alt: alts[3] || 'Sample work',
      hasReviews: n > 0, noReviews: n === 0, reviewLabel: n === 1 ? '1 review' : n + ' reviews',
      specs: d.specializations || [], isLimited: !!d.limited, isOpen: !d.limited,
      mosaic: layout !== 'strip', strip: layout === 'strip'
    };
  }
}
</script>
</body>
</html>
